services:
  db:
    ports: !reset []
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks: [internal]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    restart: always

  migrator:
    image: ghcr.io/maksim-nikolaev/windiq-api:${IMAGE_TAG:-main}
    build: !reset null
    pull_policy: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    networks: [internal]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m

  api:
    image: ghcr.io/maksim-nikolaev/windiq-api:${IMAGE_TAG:-main}
    build: !reset null
    pull_policy: always
    ports: !reset []
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      WINDIQ_BASE_URL: ${WINDIQ_BASE_URL}
      WINDIQ_CLIENT_ID: ${WINDIQ_CLIENT_ID}
      WINDIQ_CLIENT_SECRET: ${WINDIQ_CLIENT_SECRET}
      HEARTBEAT_PUSH_URL: ${HEARTBEAT_PUSH_URL:-}
    labels:
      traefik.enable: "true"
      traefik.docker.network: "edge"
      traefik.http.routers.windiq-api.rule: "Host(`windiq.rombikro.com`) && PathPrefix(`/api`)"
      traefik.http.routers.windiq-api.entrypoints: "websecure"
      traefik.http.routers.windiq-api.middlewares: "rate-limit@file"
      traefik.http.routers.windiq-api.service: "windiq-api"
      traefik.http.services.windiq-api.loadbalancer.server.port: "8080"
      traefik.http.services.windiq-api.loadbalancer.healthcheck.path: "/api/readyz"
      traefik.http.services.windiq-api.loadbalancer.healthcheck.interval: "5s"
      traefik.http.services.windiq-api.loadbalancer.healthcheck.timeout: "2s"
      prometheus.scrape: "true"
      prometheus.port: "9464"
    networks: [internal, edge, observability]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    restart: always

  web:
    image: ghcr.io/maksim-nikolaev/windiq-web:${IMAGE_TAG:-main}
    build: !reset null
    pull_policy: always
    ports: !reset []
    labels:
      traefik.enable: "true"
      traefik.docker.network: "edge"
      traefik.http.routers.windiq-web.rule: "Host(`windiq.rombikro.com`)"
      traefik.http.routers.windiq-web.entrypoints: "websecure"
      traefik.http.routers.windiq-web.middlewares: "rate-limit@file"
      traefik.http.routers.windiq-web.service: "windiq-web"
      traefik.http.services.windiq-web.loadbalancer.server.port: "3000"
    networks: [internal, edge]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    restart: always

networks:
  internal:
  edge:
    external: true
  observability:
    external: true
